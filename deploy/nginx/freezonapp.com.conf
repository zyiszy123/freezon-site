server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name freezonapp.com www.freezonapp.com;

    root /var/www/freezon-site;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name freezonapp.com www.freezonapp.com;

    root /var/www/freezon-site;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/freezonapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freezonapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
