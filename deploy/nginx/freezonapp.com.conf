server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name freezonapp.com www.freezonapp.com;

    root /var/www/freezon-site;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
